; Ghost Mode - become a see-through, glowing ghost in RDR2 story mode.
; Key names: 0-9, A-Z, F1-F12, NUM0-NUM9, INSERT, DELETE, HOME, END, PAGEUP, PAGEDOWN, BACKSPACE, NONE
; You can add CTRL+, SHIFT+ or ALT+ in front, e.g. CTRL+G

[Keys]
Toggle = F10          ; ghost on / off
Size = PAGEUP         ; normal -> big -> huge -> giant
SeeThrough = PAGEDOWN ; faint -> normal -> solid
Tails = INSERT        ; long blue ghost tails on / off
Hover = END           ; stand in the air (about 3 m up), press again to come down

[Look]
SeeThrough = 102      ; 51 faint, 102 normal, 153 solid, 255 not see-through
GlowStrength = 6      ; 3 dim, 6 normal, 11 bright
GlowColor = 150 195 255
Sparkle = 1           ; spirit glitter over the body
GhostTails = 0        ; start with the tails on
OutfitPreset = 7      ; game outfit preset put on when the ghost turns on (7 = white shirt for Arthur), -1 = keep your clothes
GlowingHorse = 1      ; the horse you ride turns ghostly too
StartSize = 0         ; 0 normal, 1 big, 2 huge, 3 giant

[Powers]
Powers = 1            ; F (melee) = punch sends people flying, left click with empty hands = blast everyone in front
PeopleFlee = 1        ; townsfolk run from you; story characters below stop, stare and gasp instead
NoWantedLevel = 1     ; no bounty / law while you're a ghost (a wanted player makes the whole town hide indoors)

[Protect]
; these story characters never run away from the ghost - they stop, stare and gasp
Models = cs_abigailroberts, cs_billwilliamson, cs_bronte, cs_catherinebraithwaite, cs_charlessmith, cs_colmodriscoll, cs_dutch, cs_eagleflies, cs_edgarross, cs_edithdown, cs_hoseamatthews, cs_jackmarston, cs_jackmarston_teen, cs_jamie, cs_javierescuella, cs_johnmarston, cs_josiahtrelawny, cs_karen, cs_kieran, cs_leighgray, cs_lenny, cs_leostrauss, cs_leviticuscornwall, cs_marybeth, cs_marylinton, cs_micahbell, cs_miltonandrews, cs_mollyoshea, cs_mrpearson, cs_mrsadler, cs_rainsfall, cs_revswanson, cs_sean, cs_susangrimshaw, cs_thomasdown, cs_tilly, cs_uncle

[Other]
Log = 1               ; writes GhostMode.log next to the .asi
